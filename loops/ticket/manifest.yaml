# Works one GitHub issue of this repository to a merged or ready PR.
#
# setup -> implement -> test -> review -> describe -> ship
#
# describe writes the PR title and description from the issue and the diff, so
# the review agent only reviews.
#
# Feedback goes to a fix step for its cause, not back to implement, so the agent
# works on the feedback and does not start over. Each cause has its own budget,
# so a flaky test cannot use up the visits a review needs:
#   test failed        -> fix-test   -> test
#   changes requested  -> fix-review -> test
#   red CI             -> fix-ci     -> test
#   conflict with main -> resolve    -> test
#
# test merges main first, so a conflict comes early and small. ship holds one
# lock for every run on this machine, so only one run merges at a time.
#
# Start it with scripts/run-ticket.sh, which picks the issue and gives the inputs.
formatVersion: 1
inputs:
  task: the issue number, title and body
  issue: 'the issue number, for "Closes #N"'
  merge: yes to merge the PR when CI is green, no to stop at a green PR
  ci: yes to wait for CI on the PR, no to skip the wait when the repository has no CI
maxTransitions: 50
# ship can wait for other runs' merges, see its timeout.
runTimeout: 4h

steps:
  - id: setup
    kind: command
    run: npm ci --no-audit --no-fund
    timeout: 10m

  - id: implement
    kind: agent
    harness: pi
    model: openai-codex/gpt-6-luna
    effort: xhigh
    promptFile: prompts/implement.md
    timeout: 60m
    outputs:
      criteria: [done]
    on:
      done: test
      blocked: $failure

  - id: test
    kind: command
    run: |
      log="$LOOPFILE_SCRATCH/test.log"
      # Other runs merge to main while this one works. Bring main in before each
      # test, so a conflict comes while it is small. It stays in progress for resolve.
      git fetch origin main
      if ! git merge --no-edit origin/main > "$LOOPFILE_SCRATCH/merge.txt" 2>&1; then
        { cat "$LOOPFILE_SCRATCH/merge.txt"; git diff --name-only --diff-filter=U; } > "$LOOPFILE_SCRATCH/conflict.txt"
        loopfile data put test.conflict "$LOOPFILE_SCRATCH/conflict.txt"
        loopfile result conflict
        exit 0
      fi
      # A left-over mutation sandbox holds a nested biome.json that breaks lint.
      rm -rf .stryker-tmp
      outcome=passed
      if ! npm run verify > "$log" 2>&1; then
        # Run it once more. A pass the second time is a flaky test, not a
        # problem of this branch, so it does not go to fix.
        mv "$log" "$log.first"
        if npm run verify > "$log" 2>&1; then
          tail -c 20000 "$log.first" > "$log.flake"
          loopfile data put test.flake "$log.flake"
        else
          outcome=failed
        fi
      fi
      # The run is niced by run-ticket.sh, so mutation can use half the cores.
      if [ "$outcome" = passed ] &&
        ! npm run quality:mutation -- --concurrency 8 >> "$log" 2>&1; then
        outcome=failed
      fi
      tail -c 60000 "$log" > "$log.tail"
      loopfile data put test.log "$log.tail"
      loopfile result "$outcome"
    timeout: 45m
    outputs:
      log: [passed, failed]
      conflict: [conflict]
    on:
      passed: review
      failed: fix-test
      conflict: resolve

  - id: review
    kind: agent
    harness: claude
    model: claude-opus-5-5
    effort: medium
    args:
      - --settings
      - '{"permissions":{"allow":["Bash(git diff *)","Bash(git log *)","Bash(git show *)","Bash(git status *)","Bash(git rev-parse *)","Bash(gh issue view *)","Bash(gh pr view *)"]}}'
    promptFile: prompts/review.md
    timeout: 20m
    outputs:
      feedback: [changes_requested]
      notes: [approved]
      sha: [approved]
    on:
      approved: describe
      changes_requested: fix-review

  - id: describe
    kind: agent
    harness: pi
    model: openai-codex/gpt-6-luna
    effort: medium
    promptFile: prompts/describe.md
    timeout: 15m
    outputs:
      title: [done]
      body: [done]
    on:
      done: ship
      blocked: $failure

  - id: fix-test
    kind: agent
    harness: pi
    model: openai-codex/gpt-6-luna
    effort: xhigh
    promptFile: prompts/fix.md
    timeout: 60m
    maxAttempts: 4
    on:
      done: test
      blocked: $failure

  - id: fix-review
    kind: agent
    harness: pi
    model: openai-codex/gpt-6-luna
    effort: xhigh
    promptFile: prompts/fix.md
    timeout: 60m
    maxAttempts: 3
    on:
      done: test
      blocked: $failure

  - id: fix-ci
    kind: agent
    harness: pi
    model: openai-codex/gpt-6-luna
    effort: xhigh
    promptFile: prompts/fix.md
    timeout: 60m
    maxAttempts: 3
    on:
      done: test
      blocked: $failure

  - id: resolve
    kind: agent
    harness: pi
    model: openai-codex/gpt-6-luna
    effort: xhigh
    promptFile: prompts/resolve.md
    timeout: 60m
    maxAttempts: 3
    on:
      done: test
      blocked: $failure

  - id: ship
    kind: command
    run: |
      issue=$(loopfile data get input.issue)
      branch=$(git branch --show-current)
      # One run ships at a time on this machine. While this run holds the lock,
      # no other run merges, so main does not move between its CI and its merge.
      mkdir -p "$HOME/.loopfile/ticket"
      exec 9> "$HOME/.loopfile/ticket/ship.lock"
      flock 9
      git fetch origin main
      if ! git merge --no-edit origin/main > "$LOOPFILE_SCRATCH/merge.txt" 2>&1; then
        { cat "$LOOPFILE_SCRATCH/merge.txt"; git diff --name-only --diff-filter=U; } > "$LOOPFILE_SCRATCH/conflict.txt"
        loopfile data put ship.conflict "$LOOPFILE_SCRATCH/conflict.txt"
        loopfile result conflict
        exit 0
      fi
      git push -u origin HEAD
      title=$(loopfile data get describe.title | head -n 1)
      # A bad title fails the PR title check, which is not a problem fix-ci can fix.
      scripts/check-pr-title.sh "$title" || title="chore: $(gh issue view "$issue" --json title -q .title)"
      body="$LOOPFILE_SCRATCH/pr-body.md"
      {
        loopfile data get describe.body
        printf '\n\nCloses #%s\n\nMade by loopfile run %s.\n' "$issue" "$LOOPFILE_RUN_ID"
      } > "$body"
      # After a red CI the PR exists, so a new description replaces the old one.
      if gh pr view --json number > /dev/null 2>&1; then
        gh pr edit --title "$title" --body-file "$body"
      else
        gh pr create --title "$title" --body-file "$body"
      fi
      ci_green=yes
      if [ "$(loopfile data get input.ci)" = yes ]; then
        # Wait up to 5m for CI to register its checks. Before that, gh says
        # "no checks reported" and exits non-zero, which is not a red CI.
        for _ in $(seq 30); do
          sleep 10
          gh pr checks 2>&1 | grep -q 'no checks reported' || break
        done
        gh pr checks --watch --fail-fast > "$LOOPFILE_SCRATCH/ci.txt" 2>&1 || ci_green=no
      fi
      if [ "$ci_green" = yes ]; then
        if [ "$(loopfile data get input.merge)" = yes ]; then
          if ! gh pr merge --squash; then
            # Someone merged to main outside the lock, for example by hand.
            # Ship again: merge main, push and wait for CI once more.
            [ "$(gh pr view --json mergeStateStatus -q .mergeStateStatus)" = BEHIND ] || exit 1
            loopfile result behind
            exit 0
          fi
          git push origin --delete "$branch"
          loopfile result merged
        else
          loopfile result ready
        fi
      else
        run=$(gh run list --branch "$branch" --limit 1 --json databaseId -q '.[0].databaseId')
        { cat "$LOOPFILE_SCRATCH/ci.txt"; gh run view "$run" --log-failed | tail -c 60000; } > "$LOOPFILE_SCRATCH/ci.log"
        loopfile data put ship.ci "$LOOPFILE_SCRATCH/ci.log"
        loopfile result ci_failed
      fi
    # Includes the wait for the lock while other runs ship.
    timeout: 2h
    outputs:
      ci: [ci_failed]
      conflict: [conflict]
    on:
      merged: $success
      ready: $success
      ci_failed: fix-ci
      conflict: resolve
      behind: ship
