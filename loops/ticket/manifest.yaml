# Works one GitHub issue of this repository to a merged or ready PR.
#
# setup -> implement -> test -> review -> ship
#
# A failed test, a review that asks for changes or a red CI goes to fix, not
# back to implement, so the agent works on the feedback and does not start over.
#
# Start it with scripts/run-ticket.sh, which picks the issue and gives the inputs.
formatVersion: 1
inputs:
  task: the issue number, title and body
  issue: the issue number, for "Closes #N"
  merge: yes to merge the PR when CI is green, no to stop at a green PR
  ci: yes to wait for CI on the PR, no to skip the wait when the repository has no CI
maxTransitions: 30
runTimeout: 3h

steps:
  - id: setup
    kind: command
    run: npm ci --no-audit --no-fund
    timeout: 10m

  - id: implement
    kind: agent
    harness: pi
    model: openai-codex/gpt-5.6-terra
    effort: high
    promptFile: prompts/implement.md
    timeout: 60m
    on:
      done: test
      blocked: $failure

  - id: fix
    kind: agent
    harness: pi
    model: openai-codex/gpt-5.6-luna
    effort: xhigh
    promptFile: prompts/fix.md
    timeout: 45m
    maxAttempts: 5          # visits from test, review and ship count
    on:
      done: test
      blocked: $failure

  - id: test
    kind: command
    run: |
      log="$LOOPFILE_SCRATCH/test.log"
      if npm run gate:quiet > "$log" 2>&1 && npm run quality:mutation >> "$log" 2>&1; then
        outcome=passed
      else
        outcome=failed
      fi
      tail -c 60000 "$log" > "$log.tail"
      loopfile data put test.log "$log.tail"
      loopfile result "$outcome"
    timeout: 45m
    outputs: [log]
    on:
      passed: review
      failed: fix

  - id: review
    kind: agent
    harness: claude
    model: claude-opus-5
    effort: medium
    args:
      - --settings
      - '{"permissions":{"allow":["Bash(git diff *)","Bash(git log *)","Bash(git show *)","Bash(git status *)"]}}'
    promptFile: prompts/review.md
    timeout: 20m
    outputs:
      feedback: [changes_requested]
      notes: [approved]
    on:
      approved: ship
      changes_requested: fix

  - id: ship
    kind: command
    run: |
      issue=$(loopfile data get input.issue)
      branch=$(git branch --show-current)
      git push -u origin HEAD
      body="$LOOPFILE_SCRATCH/pr-body.md"
      {
        printf 'Closes #%s\n\n## Review notes\n\n' "$issue"
        loopfile data get review.notes
        printf '\n\nMade by loopfile run %s.\n' "$LOOPFILE_RUN_ID"
      } > "$body"
      # After a red CI the PR exists, so a new review's notes replace the old body.
      if gh pr view --json number > /dev/null 2>&1; then
        gh pr edit --body-file "$body"
      else
        title=$(gh issue view "$issue" --json title -q .title)
        gh pr create --title "$title" --body-file "$body"
      fi
      ci_green=yes
      if [ "$(loopfile data get input.ci)" = yes ]; then
        # Wait up to 5m for CI to register its checks. Before that, gh says
        # "no checks reported" and exits non-zero, which is not a red CI.
        for _ in $(seq 30); do
          sleep 10
          gh pr checks 2>&1 | grep -q 'no checks reported' || break
        done
        gh pr checks --watch --fail-fast > "$LOOPFILE_SCRATCH/ci.txt" 2>&1 || ci_green=no
      fi
      if [ "$ci_green" = yes ]; then
        if [ "$(loopfile data get input.merge)" = yes ]; then
          gh pr merge --squash
          git push origin --delete "$branch"
          loopfile result merged
        else
          loopfile result ready
        fi
      else
        run=$(gh run list --branch "$branch" --limit 1 --json databaseId -q '.[0].databaseId')
        { cat "$LOOPFILE_SCRATCH/ci.txt"; gh run view "$run" --log-failed | tail -c 60000; } > "$LOOPFILE_SCRATCH/ci.log"
        loopfile data put ship.ci "$LOOPFILE_SCRATCH/ci.log"
        loopfile result ci_failed
      fi
    timeout: 45m
    outputs:
      ci: [ci_failed]
    on:
      merged: $success
      ready: $success
      ci_failed: fix
