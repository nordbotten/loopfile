name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes in a row must not race to update the release PR.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Keeps one open release PR with the next version and CHANGELOG.md, from the
  # Conventional Commits titles on main. Merging that PR tags the release and
  # makes the GitHub Release. The PR is opened with GITHUB_TOKEN, so CI does not
  # run on it: merge it with gh pr merge --squash --admin.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing swaps this OIDC token for a publish token, so the
      # repo holds no npm token. npm adds provenance on its own.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # npm 12 needs Node 24.15 or later, which the runner's cache may not have.
          check-latest: true
          registry-url: https://registry.npmjs.org
      # No install scripts in a job that can publish. The build does not need them.
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Stage, do not publish: the version goes live only when a maintainer
      # approves it with 2FA (npm stage approve <id>). A change to this file on
      # main cannot publish on its own. npm 11 has no stage command.
      - run: npm install -g npm@12.1.0
      - run: npm stage publish .
